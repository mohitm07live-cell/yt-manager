<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohit M07 - OBS Loyalty Leaderboard Ticker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .ticker-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 15, 28, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 9999px;
      padding: 6px 18px 6px 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 20px rgba(245, 158, 11, 0.2);
    }
    .ticker-badge {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ticker-content {
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rank-num { color: #fde047; font-weight: 800; }
    .user-name { color: #fff; }
    .pts-count { color: #38bdf8; font-family: 'Space Grotesk', monospace; font-weight: 800; }
  </style>
</head>
<body>
  <div class="ticker-bar" id="tickerBar">
    <div class="ticker-badge"><i class="fa-solid fa-trophy"></i> TOP FAN</div>
    <div class="ticker-content" id="tickerContent">
      <span class="rank-num">#1</span>
      <span class="user-name" id="topUserName">Loading Top Viewers...</span>
      <span class="pts-count" id="topUserPts"></span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let users = [];
    let currentIndex = 0;

    function renderActiveUser() {
      if (users.length === 0) return;
      const u = users[currentIndex % users.length];
      document.querySelector('.rank-num').textContent = `#${(currentIndex % users.length) + 1}`;
      document.getElementById('topUserName').textContent = u.name;
      document.getElementById('topUserPts').textContent = `${Number(u.points || 0).toLocaleString()} pts`;
      currentIndex++;
    }

    function fetchLeaderboard() {
      fetch('/api/loyalty/leaderboard?limit=5')
        .then(r => r.json())
        .then(data => {
          users = data.leaderboard || [];
          if (users.length > 0) renderActiveUser();
        })
        .catch(() => {});
    }

    fetchLeaderboard();
    setInterval(renderActiveUser, 4000); // Rotate every 4s
    setInterval(fetchLeaderboard, 30000); // Refresh data every 30s
  </script>
</body>
</html>
